[spawn]
	#Set true to allow Senpai to spawn naturally
	#是否允许野兽先辈自然生成（喜）
	spawn_senpai = false
	#Set true to allow Steel Coil to spawn naturally
	#是否允许钢卷自然生成
	spawn_steel_coil = false
	#this feature is under development, DO NOT TURN THIS ON!
	#是否允许生成持枪生物，测试功能，不要开启
	spawn_mob_with_guns = false

[projectile]
	#Set true to allow projectiles to destroy certain blocks
	#是否允许子弹破坏方块
	allow_projectile_destroy_blocks = false
	#Set true to allow projectiles to load chunks
	#是否允许投射物加载区块
	projectile_chunk_loading = true

[explosion]
	#The percentage of explosion damage you take behind cover
	#躲在掩体后时受到的爆炸伤害比例
	# Default: 15
	# Range: 0 ~ 100
	explosion_penetration_ratio = 15
	#Set true to allow Explosion to destroy blocks
	#是否开启爆炸破坏方块
	explosion_destroy = true
	#Explosion block destruction strength multiplier. 100 is normal, 50 is half, 200 is double.
	# Default: 100
	# Range: 0 ~ 1000
	explosion_block_damage_multiplier_percent = 100
	#Maximum blocks one SBW explosion may destroy. Keeps large firefights from freezing the server main thread.
	#0 disables block destruction for SBW explosions. Raise this only if the server has enough tick headroom.
	# Default: 768
	# Range: 0 ~ 8192
	explosion_max_destroyed_blocks = 768
	#Set true to allow explosions to drop destroyed blocks
	explosion_drop_blocks = false
	#Set true to allow SBW explosions to start vanilla fire blocks. Fire behavior can then be handled by fire overhaul mods.
	explosion_ignite_fire = true
	#Chance for each SBW explosion to start fires
	# Default: 20
	# Range: 0 ~ 100
	explosion_fire_chance_percent = 20
	#Maximum fire blocks a single SBW explosion may place
	# Default: 8
	# Range: 0 ~ 256
	explosion_max_fire_blocks = 8
	#Set true to enable extra explosion effect. For example, C4 and RPG will destroy blocks before explosion
	#是否开启额外破坏效果，例如C4和RPG弹头的破坏方块效果
	extra_explosion_effect = true
	#Set true to allow mines to ignore friendly entities
	#地雷等爆炸物是否会无视友方
	friendly_mines = true

	[explosion."RGO Grenade"]
		#The explosion damage of RGO grenade
		#RGO手榴弹的爆炸伤害
		# Default: 90
		# Range: 1 ~ 10000000
		rgo_grenade_explosion_damage = 90
		#The explosion radius of RGO grenade
		#RGO手榴弹的爆炸半径
		# Default: 5
		# Range: 1 ~ 50
		rgo_grenade_explosion_radius = 5

	[explosion."M67 Grenade"]
		#The explosion damage of M67 grenade
		#M67手榴弹的爆炸伤害
		# Default: 120
		# Range: 1 ~ 10000000
		m67_grenade_explosion_damage = 120
		#The explosion radius of M67 grenade
		#M67手榴弹的爆炸半径
		# Default: 6
		# Range: 1 ~ 50
		m67_grenade_explosion_radius = 6

	[explosion.C4]
		#The explosion countdown of C4
		#定时C4炸弹的爆炸倒计时
		# Default: 514
		# Range: > 1
		c4_explosion_countdown = 514
		#The explosion damage of C4
		#C4炸弹的爆炸伤害
		# Default: 300
		# Range: > 1
		c4_explosion_damage = 300
		#The explosion radius of C4
		#C4炸弹的爆炸半径
		# Default: 10
		# Range: > 1
		c4_explosion_radius = 10

	[explosion.Claymore]
		#The explosion damage of Claymore
		#阔剑地雷的爆炸伤害
		# Default: 140
		# Range: > 1
		claymore_explosion_damage = 140
		#The explosion radius of Claymore
		#阔剑地雷的爆炸半径
		# Default: 4
		# Range: > 1
		claymore_explosion_radius = 4

	[explosion."Blu 43"]
		#The explosion damage of Blu 43
		#蝴蝶雷的爆炸伤害
		# Default: 10
		# Range: > 1
		blu_43_explosion_damage = 10
		#The explosion radius of Blu 43
		#蝴蝶雷的爆炸半径
		# Default: 2
		# Range: > 1
		blu_43_explosion_radius = 2

	[explosion.EDD]
		#The explosion damage of EDD
		#防止攻入装置的爆炸伤害
		# Default: 60
		# Range: > 1
		edd_explosion_damage = 60
		#The explosion radius of EDD
		#防止攻入装置的爆炸半径
		# Default: 3
		# Range: > 1
		edd_explosion_radius = 3
		#The trace range of EDD
		#防止攻入装置的触发距离
		# Default: 2
		# Range: > 1
		edd_trace_range = 2

	[explosion."Tm 62"]
		#The explosion damage of Tm 62
		#TM62反坦克地雷的爆炸伤害
		# Default: 450
		# Range: > 1
		tm_62_explosion_damage = 450
		#The explosion radius of Tm 62
		#TM62反坦克地雷的爆炸半径
		# Default: 13
		# Range: > 1
		tm_62_explosion_radius = 13

	[explosion."Lunge Mine"]
		#The explosion damage of Lunge Mine
		#突刺爆雷的爆炸伤害
		# Default: 60
		# Range: > 1
		lunge_mine_explosion_damage = 60
		#The attack damage of Lunge Mine
		#突刺爆雷的直击伤害
		# Default: 600
		# Range: > 1
		lunge_mine_attack_damage = 600
		#The explosion radius of Lunge Mine
		#突刺爆雷的爆炸半径
		# Default: 4
		# Range: > 1
		lunge_mine_explosion_radius = 4

	[explosion."Ptkm 1r"]
		#The explosion damage of Ptkm 1r
		#PTKM1R地雷的爆炸伤害
		# Default: 100
		# Range: > 1
		ptkm_1r_explosion_damage = 100
		#The explosion radius of Ptkm 1r
		#PTKM1R地雷的爆炸半径
		# Default: 6
		# Range: > 1
		ptkm_1r_explosion_radius = 6
		#The hit damage of projectile launched by Ptkm 1r
		#PTKM1R地雷发射的投射物的直击伤害
		# Default: 500
		# Range: > 1
		ptkm_1r_projectile_hit_damage = 500
		#The explosion damage of projectile launched by Ptkm 1r
		#PTKM1R地雷发射的投射物的爆炸伤害
		# Default: 80
		# Range: > 1
		ptkm_1r_projectile_explosion_damage = 80
		#The explosion radius of projectile launched by Ptkm 1r
		#PTKM1R地雷发射的投射物的爆炸半径
		# Default: 7
		# Range: > 1
		ptkm_1r_projectile_explosion_radius = 7

[vehicle]
	#Allow vehicles to pick up items
	#是否允许载具拾取物品
	vehicle_item_pickup = true
	#Allow certain vehicles to load chunks
	#是否允许部分载具加载区块
	vehicle_chunk_loading = true
	#Set true to allow only entities in same team to enter vehicle
	#是否仅允许同队伍玩家进入同一辆载具
	same_team_enter_vehicle = true
	#Use timed boarding and dismounting for vehicles
	boarding_delay_enabled = true
	#Base vehicle boarding time in ticks
	# Default: 40
	# Range: 1 ~ 1200
	boarding_entry_base_ticks = 40
	#Extra boarding time at zero vehicle health, in ticks
	# Default: 40
	# Range: 0 ~ 1200
	boarding_entry_damage_extra_ticks = 40
	#Base vehicle dismounting time in ticks
	# Default: 60
	# Range: 1 ~ 1200
	boarding_exit_base_ticks = 60
	#Extra dismounting time at zero vehicle health, in ticks
	# Default: 100
	# Range: 0 ~ 1200
	boarding_exit_damage_extra_ticks = 100
	#Maximum distance from the vehicle while boarding
	# Default: 6.0
	# Range: 1.0 ~ 32.0
	boarding_max_distance = 6.0
	#Distance a player may move from the boarding start position before it is canceled
	# Default: 2.25
	# Range: 0.25 ~ 32.0
	boarding_cancel_move_distance = 2.25
	#Allow vehicles to collect drops after killing other entities by crashing
	#是否允许载具撞击击杀生物后，自动拾取掉落物
	collect_drops_by_crashing = true
	#Within this distance, the vehicle info will be displayed at client side
	#载具信息显示的最大距离
	# Default: 196
	# Range: 0 ~ 1024
	vehicle_info_display_distance = 196
	#Lifetime of vehicle wrecks in ticks. Set to -1 to keep wrecks forever
	#иЅЅе…·ж®‹йЄёе­ењЁж—¶й—ґпј€е€»пј‰пјЊ-1 дёєж°ёд№…дїќз•™
	# Default: 12000
	# Range: > -1
	vehicle_wreck_lifetime = 12000
	#Hide random safe model bones on destroyed vehicles so wrecks look physically damaged
	wreck_random_hidden_parts = true
	#Random wreck visual damage mode: safe, medium, aggressive
	wreck_hidden_parts_mode = "safe"
	#Minimum random model parts hidden on destroyed vehicles
	# Default: 1
	# Range: 0 ~ 32
	wreck_hidden_parts_min = 1
	#Maximum random model parts hidden on destroyed vehicles
	# Default: 4
	# Range: 0 ~ 32
	wreck_hidden_parts_max = 4
	#Maximum wheels hidden by random wreck visual damage. Keep low so wrecks do not look like they float
	# Default: 2
	# Range: 0 ~ 16
	wreck_hidden_wheels_max = 2
	#Maximum server particle transmission distance for the primary wreck fire smoke
	# Default: 192
	# Range: 32 ~ 256
	wreck_smoke_render_distance = 192
	#Height of the primary wreck smoke column, in blocks
	# Default: 18
	# Range: 6 ~ 64
	wreck_smoke_column_height = 18
	#Generate deterministic burnt and rusted textures for destroyed vehicles
	wreck_burnt_textures = true
	#Strength of soot and burnt paint on destroyed vehicles, in percent
	# Default: 82
	# Range: 0 ~ 100
	wreck_burn_intensity_percent = 82
	#Amount of patchy exposed rust on destroyed vehicles, in percent
	# Default: 38
	# Range: 0 ~ 100
	wreck_rust_amount_percent = 38
	#Keep persistent projectile impact decals on vehicles
	damage_marks_enabled = true
	#Maximum persistent projectile impact decals stored per vehicle
	# Default: 18
	# Range: 0 ~ 64
	damage_marks_max = 18
	#Maximum distance at which vehicle impact decals are rendered, in blocks
	# Default: 128
	# Range: 8 ~ 512
	damage_marks_render_distance = 128
	#Chance that a damaging non-ricochet hit leaves a dent instead of a penetration mark
	# Default: 32
	# Range: 0 ~ 100
	damage_mark_dent_chance_percent = 32
	#Accumulate persistent surface-dependent dirt on moving wheeled and tracked vehicles
	vehicle_dirt_enabled = true
	#Extra global chance for destroyed turreted vehicles to cook off and throw the turret, in percent
	# Default: 8
	# Range: 0 ~ 100
	wreck_ammo_cookoff_turret_chance_percent = 8
	#Multiplier for turret throw force after ammo cook-off, in percent
	# Default: 140
	# Range: 0 ~ 1000
	wreck_turret_throw_force_multiplier_percent = 140
	#The damage of self explosion when a vehicle is destroyed
	#载具被击毁时，乘客受到的伤害
	# Default: 114514
	# Range: > 0
	self_explosion_damage = 114514
	#The damage count of self explosion when a vehicle is destroyed
	#载具被击毁时，对乘客造成的伤害次数
	# Default: 5
	# Range: 0 ~ 100
	self_explosion_count = 5
	#The air crash damage when an aircraft is destroyed
	#飞行载具坠机时，乘客受到的伤害
	# Default: 114514
	# Range: > 0
	air_crash_explosion_damage = 114514
	#The air crash damage count when an aircraft is destroyed
	#飞行载具坠机时，对乘客造成的伤害次数
	# Default: 5
	# Range: 0 ~ 100
	air_crash_explosion_count = 5
	#The rate of recycling loot items from turret wreckage
	#从载具炮塔残骸中回收的材料比例
	# Default: 0.3
	# Range: 0.0 ~ 1.0
	turret_wreckage_loot_rate = 0.3
	#List of entity types that can be scanned by radar
	#能够被雷达扫描的实体类型白名单
	scan_white_list = ["ywzj_vehicle:*"]

	[vehicle.collision]
		#Allows vehicles to destroy soft blocks via collision
		#是否允许载具撞坏柔软方块
		collision_destroy_soft_blocks = false
		#Allows vehicles to destroy normal blocks via collision
		#是否允许载具撞坏普通方块
		collision_destroy_normal_blocks = false
		#Allows vehicles to destroy hard blocks via collision
		#是否允许载具撞坏坚硬方块
		collision_destroy_hard_blocks = false
		#Allows vehicles to destroy blocks via collision like a beast
		#是否开启载具野兽撞击模式（只看方块硬度）
		collision_destroy_blocks_beastly = false
		#List of entities that can be damaged by collision
		#能够被载具撞击的实体白名单
		collision_entity_whitelist = []

	[vehicle.terrain_mobility]
		#Apply surface-dependent speed to wheeled and tracked vehicles
		enabled = true
		#Strength of terrain speed differences; 0 disables the difference and 100 uses realistic defaults
		# Default: 100
		# Range: 0 ~ 150
		strength_percent = 100

	[vehicle.combat_systems]
		#Damage multiplier applied to RPG, ATGM, TOW, Javelin, AGM and other anti-tank projectiles against vehicles
		#The v2 key intentionally replaces the stacked legacy 1.75 multiplier
		# Default: 1.2
		# Range: 0.0 ~ 20.0
		anti_tank_damage_multiplier_v2 = 1.2
		#Multiplier for vehicle smoke-screen reload time
		# Default: 2.0
		# Range: 0.1 ~ 20.0
		smoke_reload_multiplier = 2.0
		#Gepard damage multiplier against main battle tanks; aircraft damage is unchanged
		# Default: 0.2
		# Range: 0.0 ~ 2.0
		gepard_tank_damage_multiplier = 0.2
		#Gepard damage multiplier against other ground vehicles; aircraft damage is unchanged
		# Default: 0.55
		# Range: 0.0 ~ 2.0
		gepard_ground_damage_multiplier = 0.55

		[vehicle.combat_systems.ricochet]
			#Enable angle-dependent ricochets for kinetic cannon projectiles
			enabled = true
			#Minimum impact angle from the armor normal, in degrees
			# Default: 70.0
			# Range: 45.0 ~ 89.0
			minimum_angle_v2 = 70.0
			#Maximum ricochet chance at a nearly tangential impact
			# Default: 0.55
			# Range: 0.0 ~ 1.0
			maximum_chance_v2 = 0.55

		[vehicle.combat_systems.laser_warning]
			#Warn vehicle crews about incoming guided anti-tank threats
			enabled = true
			#Maximum trajectory-warning range for manually guided anti-tank missiles
			# Default: 192.0
			# Range: 16.0 ~ 512.0
			range = 192.0

		[vehicle.combat_systems.active_protection]
			#APS entries: entity_id|max_ammo|reload_ticks|intercept_range
			#Example: vvp:m1a2_sep|6|600|8.0
			vehicles = ["vvp:m1a2_sep|6|600|8.0", "vvp:t90_m|12|1200|9.0"]
			#Minimum safe interception distance from the protected vehicle
			# Default: 2.25
			# Range: 0.5 ~ 16.0
			minimum_intercept_range = 2.25
			#Maximum distance at which players receive forced APS particles
			# Default: 192.0
			# Range: 32.0 ~ 512.0
			effect_range = 192.0
			#APS interception sound volume; audible distance is fixed independently
			# Default: 2.5
			# Range: 1.0 ~ 16.0
			sound_volume = 2.5
			#Chance in percent that APS fails to react to an otherwise valid incoming projectile
			# Default: 10
			# Range: 0 ~ 100
			failure_chance_percent = 10
			#How directly a projectile must be approaching the vehicle, from -1 to 1
			# Default: 0.35
			# Range: -1.0 ~ 1.0
			approach_dot = 0.35

	[vehicle.amphibious]
		#Per-vehicle buoyancy overrides: entity_id|buoyancy. Use 0 to disable floating.
		vehicles = ["vvp:bmp_2|0.052", "vvp:bmp_2_bakhcha|0.052", "vvp:bmp_2m|0.052", "vvp:bmp_3|0.052", "vvp:brm|0.052", "vvp:chryzantema|0.052", "vvp:btr_4|0.052", "vvp:pantsir_s1|0.0", "vvp:m1a2|0.0"]

	[vehicle.repair]
		#The default cooldown of vehicle repair. Set a negative value to disable vehicle repair
		#载具自动回血的触发时间，设置为负数时禁用自动回血
		# Default: 200
		# Range: -1 ~ 100000000
		repair_cooldown = 200
		#Require welding visible impact marks to repair vehicle health
		targeted_damage_repair = true
		#Distance at which a held repair tool highlights repairable impact marks
		# Default: 10
		# Range: 3 ~ 64
		mark_highlight_range = 10
		#Radius in blocks around the welding hit where all impact marks are repaired together
		# Default: 2
		# Range: 1 ~ 16
		mark_repair_radius = 2
		#The default amount of health restored per tick when a vehicle is self-repairing
		#载具每游戏刻自动回血的数值
		# Default: 0.05
		# Range: -1.0E8 ~ 1.0E8
		repair_amount = 0.05

[auto_turret_luckperms]
	#Enable automatic turret targeting by LuckPerms groups. Works on Arclight/Bukkit servers with LuckPerms installed.
	luckperms_auto_fire = false
	#LuckPerms groups whose players should be attacked when they are riding any vehicle. Empty list disables LuckPerms targeting.
	target_groups = ["enemy"]
	#Auto turret LuckPerms targeting radius in blocks
	# Default: 96.0
	# Range: 8.0 ~ 512.0
	radius = 96.0
	#Delay before firing after a valid enemy vehicle is acquired
	# Default: 60
	# Range: 0 ~ 12000
	lock_delay_ticks = 60
	#Distance in blocks at which players can hear the auto turret lock siren
	# Default: 96.0
	# Range: 8.0 ~ 512.0
	siren_range = 96.0
	#How often the turret repeats the lock siren while tracking an enemy vehicle
	# Default: 80
	# Range: 10 ~ 12000
	siren_interval_ticks = 80
	#If true, the turret only fires when ammo is available. It still aims and plays siren without ammo.
	require_ammo_to_fire = true

[misc]
	#Set true to enable kill feedback sending
	#是否在服务端启用击杀提示播报
	send_kill_feedback = true
	#Set true to enable force damage
	#是否开启强制伤害模式
	force_damage_mode = false
	#Whether to drop an ammo box after the player dies
	#玩家在死亡时，是否掉落弹药
	drop_ammo_box = false
	#The default maximum armor level for normal armors
	#普通护甲能加的防弹插板数量
	# Default: 1
	# Range: 0 ~ 10000000
	default_armor_level = 1
	#The maximum armor level for armors with superbwarfare:military_armor tag
	#军事护甲能加的防弹插板数量
	# Default: 2
	# Range: 0 ~ 10000000
	military_armor_level = 2
	#The maximum armor level for armors with superbwarfare:military_armor_heavy tag(will override superbwarfare:military_armor tag!)
	#重型护甲能加的防弹插板数量
	# Default: 3
	# Range: 0 ~ 10000000
	heavy_military_armor_level = 3
	#The points per level for armor plate
	#防弹插板提供的伤害吸收量
	# Default: 15
	# Range: 0 ~ 10000000
	armor_point_per_level = 15
	#Max energy storage of charging station
	#充电站的最大存储能量
	# Default: 4000000
	# Range: > 1
	charging_station_max_energy = 4000000
	#How much FE energy can charging station generate per tick
	#充电站每游戏刻的发电数量
	# Default: 128
	# Range: > 1
	charging_station_generate_speed = 128
	#How much FE energy can charging station transfer per tick
	#充电站每游戏刻的最大传输能量数值
	# Default: 100000
	# Range: > 1
	charging_station_transfer_speed = 100000
	#The charging radius of the charging station
	#充电站的最大传输能量范围
	# Default: 8
	# Range: 0 ~ 128
	charging_station_charge_radius = 8
	#The default fuel time of the charging station
	#充电站的默认燃料燃烧时长
	# Default: 1600
	# Range: > 1
	charging_station_default_fuel_time = 1600
	#The max size of artillery indicator binding list
	#火炮指示器的最大绑定数量
	# Default: 32
	# Range: > 1
	artillery_indicator_list_size = 32
	#Set true to make mine hitbox invisible
	#是否隐藏地雷的碰撞箱
	mine_hitbox_invisible = false
	#The max fuel count of blueprint research table
	#蓝图研究台的最大燃料值
	# Default: 8
	# Range: 1 ~ 128
	blueprint_research_table_max_fuel = 8
	#The minimum health percentage for activating steel coils
	#激怒钢卷所需的最小生命值比例
	# Default: 0.99
	# Range: 0.0 ~ 1.0
	steel_coil_awake_percentage = 0.99
	#Set true to allow smoke to prevent entities from being set as target
	#是否允许烟雾弹消除生物仇恨
	smoke_hide_target = false

	[misc.sync]
		#Set true to enable synchronizing client entities with the server
		#是否允许服务端同步超视距的客户端实体
		sync_entity_over_range = true
		#The interval for synchronizing client entities with the server (tick)
		#服务端同步客户端实体的间隔（单位为刻）
		# Default: 10
		# Range: > 1
		sync_entity_interval = 10
		#The expire time for synchronized client entities (ms)
		#同步到客户端的实体的数据失效时间（单位为毫秒）
		# Default: 1000
		# Range: > 1
		client_sync_expire_time = 1000

	[misc."medical kit"]
		#Set true to enable player throwing medical kits
		#是否允许玩家投掷医疗包
		throw_medical_kit = true
		#The healing value of using medical kits
		#使用医疗包的固定治疗数值
		# Default: 5
		# Range: > 0
		medical_kit_heal_amount = 5
		#The percentage of the player's health restored using the medical kit
		#使用医疗包治疗的玩家生命值比例
		# Default: 0.25
		# Range: 0.0 ~ 1.0
		medical_kit_heal_percentage = 0.25
		#The healing value of picking up medical kit entity
		#拾取医疗包实体的固定治疗数值
		# Default: 5
		# Range: > 0
		medical_kit_entity_heal_amount = 5
		#The percentage of the player's health restored picking up medical kit entity
		#拾取医疗包实体治疗的玩家生命值比例
		# Default: 0.25
		# Range: 0.0 ~ 1.0
		medical_kit_entity_heal_percentage = 0.25

[ammo]
