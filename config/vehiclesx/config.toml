[prefix]
  normal = '&2|&f '
  error = '&c|&f '

[water-damage]
  delay-seconds = 1
  explosion-power = 2.0
  allowed-submerge-percent = 70
  ignored-vehicles = ['testmod:testboat', 'testmod:sub2']

[gui.parking]
  title-format = '&f 炎 ← {parking}'
  item-lore = [
    '',
    '&2| &7Статус: {statusColor}{statusText}',
    '&2| &7Активно/Всего: &f{activeVehicles}&7/&f{storageVehicles}',
    '',
    '&2→ &fНажмите, что-бы заспавнить транспорт',
]
  rows = 6
  vehicle-slots = [11, 14, 29, 32, 47, 50]
  page-size = 6

[gui.interaction-menu]
  interact-notification = '&fНажмите &eF&f, для взаимодействия'
  return-lore = [
    '',
    '&2| &7Убрать транспорт в гараж.',
    '&2| &7Внутри транспорта НЕ должно быть предметов.',
    '',
    '&2→ &fНажмите, что-бы убрать транспорт',
]
  sell-lore = [
    '',
    '&c| &7Продать транспорт на переработку.',
    '&c| &7Вы получите &e{supply} &7сырья ({percent}% от стоимости).',
    '&c| &7Транспорт будет &cУНИЧТОЖЕН&7.',
    '',
    '&c→ &fНажмите, что-бы продать транспорт',
]

[navigation.button]
